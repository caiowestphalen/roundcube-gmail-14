<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title></title>
        <link rel="stylesheet" href="styles/styles.css" />
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                background: var(--color-surface);
            }
            .wm {
                height: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 24px;
                text-align: center;
            }
            .wm-icon {
                display: grid;
                place-items: center;
                width: 80px;
                height: 80px;
                margin-bottom: 24px;
                border-radius: 24px;
                background: var(--color-surface-container-high);
                color: var(--color-primary);
            }
            .wm-icon .ico {
                font-size: 36px;
            }
            h1 {
                margin: 0 0 8px;
                font: 500 20px / 28px var(--font-sans);
                color: var(--color-on-surface);
            }
            p {
                margin: 0;
                max-width: 280px;
                font: 400 14px / 22px var(--font-sans);
                color: var(--color-on-surface-variant);
            }
        </style>
        <script>
            try {
                document.documentElement.classList.toggle(
                    'dark-mode',
                    parent.document.documentElement.classList.contains('dark-mode')
                );
            } catch (e) {}
        </script>
    </head>
    <body>
        <main class="wm">
            <div class="wm-icon" aria-hidden="true"><i class="ico ico-mail"></i></div>
            <h1>Nenhuma mensagem selecionada</h1>
            <p>Selecione uma mensagem para lê-la aqui.</p>
        </main>
        <script>
            try {
                const task = parent.rcmail?.env?.task;
                const action = parent.rcmail?.env?.action;
                const states = {
                    addressbook: [
                        'ico-contacts',
                        'Nenhum contato selecionado',
                        'Selecione um contato para ver seus detalhes.',
                    ],
                    settings: [
                        'ico-settings',
                        'Suas preferências',
                        'Escolha uma seção para personalizar seu webmail.',
                    ],
                };
                const settingsStates = {
                    folders: [
                        'ico-folder',
                        'Suas pastas',
                        'Selecione uma pasta para gerenciar suas configurações.',
                    ],
                    identities: [
                        'ico-person',
                        'Suas identidades',
                        'Selecione uma identidade para editar seus detalhes e assinatura.',
                    ],
                    responses: [
                        'ico-description',
                        'Respostas salvas',
                        'Crie uma resposta ou selecione uma para editar.',
                    ],
                    'plugin.managesieve': [
                        'ico-filter-list',
                        'Filtros de e-mail',
                        'Selecione um filtro para editar suas regras e ações.',
                    ],
                    'plugin.carddav': [
                        'ico-contacts',
                        'Livros de endereços conectados',
                        'Adicione uma conta ou selecione um livro de endereços para gerenciá-lo.',
                    ],
                };
                if (task === 'settings' && settingsStates[action])
                    states.settings = settingsStates[action];
                if (states[task]) {
                    const [icon, title, description] = states[task];
                    document.querySelector('.ico').className = 'ico ' + icon;
                    document.querySelector('h1').textContent = title;
                    document.querySelector('p').textContent = description;
                }
            } catch (e) {}
        </script>
    </body>
</html>
